# Deploy website CekCitra (folder web/) ke GitHub Pages setiap ada perubahan di web/.
# Di GitHub Pages hanya frontend statis yang berjalan, jadi hasil deteksi berupa simulasi
# sampai model dihubungkan ke server Python (tahap 5).
name: Deploy website ke GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
