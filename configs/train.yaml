# ============================================================
# Konfigurasi eksperimen ablation (CD-2 T4, K3, E1)
# 3 arsitektur x (tanpa SE, dengan SE) x 3 seed = 18 run
# ============================================================

manifest: "data/manifests/manifest.csv"
experiments_dir: "experiments"

# Nama arsitektur -> nama model timm. Varian MobileNet [TERBUKA];
# lihat docs/decisions.md D-03.
architectures:
  resnet50: resnet50.a1_in1k
  efficientnetv2_b0: tf_efficientnetv2_b0.in1k
  mobilenetv3_large: mobilenetv3_large_100.ra_in1k

se_options: [false, true]
seeds: [42, 43, 44]

# Extension SE (Hu dkk., 2018): satu blok SE pada peta fitur terakhir
# backbone, sebelum global pooling. Lihat docs/decisions.md D-02.
se:
  reduction: 16

input_size: 224
pretrained: true

train:
  epochs: 20
  batch_size: 32
  num_workers: 4
  lr_backbone: 1.0e-4
  lr_head: 1.0e-3            # head + blok SE
  weight_decay: 1.0e-4
  early_stopping_patience: 5
  amp: true

# Augmentasi diterapkan SAMA pada kedua kelas (Bagian 8; T6)
augment:
  hflip_p: 0.5
  jpeg_p: 0.5
  jpeg_quality: [60, 100]
  blur_p: 0.1
  color_p: 0.2               # filter ringan: kecerahan/kontras/saturasi
  color_strength: 0.15
